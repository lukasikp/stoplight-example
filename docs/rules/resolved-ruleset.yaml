description: "## Stoplight Style Guide\n\nStoplight's built-in style guide contains style and validation rules for OAS (OpenAPI specification) 2 and 3.x. \n\nThis built-in style guide is always initially enabled for Stoplight API projects. \n\nYou can:\n\n- Use the style guide as-is to [automatically lint](https://meta.stoplight.io/docs/platform/7975f76a794c4-validation-and-linting) your API files\n- [Disable individual rules](https://meta.stoplight.io/docs/platform/3f80fd36750e3-disable-inherited-rules)  that do not follow your organization's standards\n- [Disable the entire style guide](https://meta.stoplight.io/docs/platform/ff8502dfbe156-enable-a-style-guide#disable-a-style-guide)\n- [Reuse and customize rules](https://meta.stoplight.io/docs/platform/2331c5241ddfc) to meet your needs\n\n> For best results, never disable the `oas2-schema` and `oas3-schema` rules. These rules validate the structure of your API document against the OpenAPI specification."
formats:
- oas2
- oas3
- oas3.0
- oas3.1
functions:
- oasDiscriminator
- oasDocumentSchema
- oasExample
- oasOpFormDataConsumeCheck
- oasOpIdUnique
- oasOpParams
- oasOpSecurityDefined
- oasOpSuccessResponse
- oasPathParam
- oasSchema
- oasTagDefined
- oasUnusedComponent
- refSiblings
- serverVariables
- typedEnum
functionsDir: functions
rules:
  contact-url:
    given:
    - $.info.contact
    severity: warn
    then:
      function: truthy
      field: url
    description: "The `contact` object should have a valid organization URL. \n\n**Valid Example**\n\n```json lineNumbers\n{\n  \"contact\": {\n     ... ,\n     \"url\": \"https://acme.com\",\n     ... \n},\n```"
    message: Contact object should have "url".
  contact-email:
    given:
    - $.info.contact
    severity: warn
    then:
      function: truthy
      field: email
    description: "The `contact` object should have a valid email. \n\n**Valid Example**\n\n```json lineNumbers\n{\n  \"contact\": {\n     ... ,\n     ... ,\n     \"email\": \"support.contact@acme.com\"\n},\n```"
    message: Contact object should have "email"
  info-contact:
    given:
    - $
    severity: warn
    then:
      function: truthy
      field: info.contact
    description: "The `info' object should include a `contact` object.\n\n**Valid Example**\n\n```json lineNumbers\n{\n  \"info\": {\n    ... ,\n    ... ,\n    \"contact\": {\n      \"name\": \"ACME Corporation\",\n      \"url\": \"https://acme.com\",\n      \"email\": \"support.contact@acme.com\"\n    }\n  } \n}\n```"
    message: Info object should have "contact" object.
  info-description:
    given:
    - $
    severity: warn
    then:
      function: truthy
      field: info.description
    description: "The `info` object should have a `description` object.\n\n**Valid Example**\n\n```json lineNumbers\n{\n  \"info\": {\n    ... ,\n    ... ,\n    \"description\": \"This describes my API.\",\n    ... \n    }\n  } \n}\n```"
    message: Info object should have "description" object.
  info-license:
    given:
    - $
    severity: warn
    then:
      function: truthy
      field: info.license
    description: "The `info` object should have a `license` object. \n\n**Valid Example**\n\n```json lineNumbers\n{\n  \"info\": {\n    ... ,\n    ... ,\n    \"license\": {\n      \"name\": \"Attribution-ShareAlike 4.0 International (CC BY-SA 4.0)\",\n      \"url\": \"https://creativecommons.org/licenses/by-sa/4.0/\"\n    }\n  } \n}\n```"
    message: Info object should have "license" object.
  license-url:
    given:
    - $.info.license
    severity: warn
    then:
      function: truthy
      field: url
    description: |-
      The `license` object should include a valid url.

      **Valid Example**

      ```json lineNumbers
      {
        "license": {
          "name": "Attribution-ShareAlike 4.0 International (CC BY-SA 4.0)",
          "url": "https://creativecommons.org/licenses/by-sa/4.0/"
        }
      }
      ```
    message: License object should include "url".
  no-eval-in-markdown:
    given:
    - $..[description,title]
    severity: warn
    then:
      function: pattern
      functionOptions:
        notMatch: eval\(
    description: "Markdown descriptions should not contain [`eval()` functions](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/eval), which pose a security risk. \n\n**Invalid Example**\n\n```json lineNumbers\n{  \n  \"info\": {\n    ... ,\n    ... , \n    \"description\": \"API for users. eval()\""
    message: Markdown descriptions must not have "eval(".
  no-script-tags-in-markdown:
    given:
    - $..[description,title]
    severity: warn
    then:
      function: pattern
      functionOptions:
        notMatch: <script
    description: "Markdown descriptions should not contain `script` tags, which pose a security risk. \n\n**Invalid Example**\n\n```json lineNumbers\n{  \n  \"info\": {\n    ... ,\n    ... , \n    \"description\": \"API for users. <script>alert(\"You are Hacked\");</script>',\"\n```"
    message: Markdown descriptions must not have "<script>" tags.
  openapi-tags-alphabetical:
    given:
    - $
    severity: warn
    then:
      function: alphabetical
      functionOptions:
        keyedBy: name
      field: tags
    description: |-
      Global tags specified at the root OpenAPI Document level should be in alphabetical order based on the `name` property.

      **Invalid Example**

      ```json lineNumbers
      {
         "tags":[
            {
               "name":"Z Global Tag"
            },
            {
               "name":"A Global Tag"
            }
         ]
      }
      ```

      **Valid Example**

      ```json lineNumbers
      {
         "tags":[
            {
               "name":"A Global Tag"
            },
            {
               "name":"Z Global Tag"
            }
         ]
      }
      ```
    message: OpenAPI object should have alphabetical "tags".
  openapi-tags:
    given:
    - $
    severity: warn
    then:
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 1
      field: tags
    description: |-
      At least one global tag should be specified at the root OpenAPI Document level.

      **Valid Example**

      ```json lineNumbers
      {
         "tags":[
            {
               "name":"Global Tag #1"
            },
            {
               "name":"Global Tag #2"
            }
         ]
      }
      ```
    message: OpenAPI object should have non-empty "tags" array.
  operation-description:
    given:
    - $.paths[*][get,put,post,delete,options,head,patch,trace]
    severity: warn
    then:
      function: truthy
      field: description
    description: "Each operation should have a description. \n\n**Valid Example**\n\n```json lineNumbers\n{\n  \"get\": {\n    ... ,\n    \"description\": \"Get a list of users.\",\n    ... ,\n    ... ,\n  }\n}\n```"
    message: Operation "description" should be present and non-empty string.
  operation-operationId:
    given:
    - $.paths[*][get,put,post,delete,options,head,patch,trace]
    severity: warn
    then:
      function: truthy
      field: operationId
    description: |-
      All operations should have an `operationId`.

      **Valid Example**

      ```json lineNumbers
      {
        "get": {
              "summary": "Get users",
              ... ,
              "operationId": "get-users"
            }
      }
      ```
    message: Operation should have "operationId".
  operation-operationId-valid-in-url:
    given:
    - $.paths[*][get,put,post,delete,options,head,patch,trace]
    severity: error
    then:
      function: pattern
      functionOptions:
        match: ^[A-Za-z0-9-._~:/?#\[\]@!\$&'()*+,;=]*$
      field: operationId
    description: "Operation IDs must not contain characters that are invalid for URLs. \n\n**Invalid Example**\n\nThe `operationId` in this example includes a pipe and space, which are invalid for URLs.\n\n```json lineNumbers\n{\n    \"/users\": {\n      \"get\": {\n        ... ,\n         \"operationId\": \"invalid|operationID \",\n         ... ,\n      }\n    }\n}\n```\n\n**Valid Example**\n\nThis `operationId` is valid for URLs.\n\n```json lineNumbers\n{\n    \"/users\": {\n      \"get\": {\n        ... ,\n         \"operationId\": \"this-must-be-unique\",\n         ... ,\n      }\n    }\n}\n```"
    message: OperationId should not have characters that are invalid when used in URL.
  operation-singular-tag:
    given:
    - $.paths[*][get,put,post,delete,options,head,patch,trace].tags
    severity: 'off'
    then:
      function: length
      functionOptions:
        max: 1
    description: Operation should not have more than a single tag.
    message: Operation should not have more than a single tag.
  operation-tags:
    given:
    - $.paths[*][get,put,post,delete,options,head,patch,trace]
    severity: warn
    then:
      function: length
      functionOptions:
        max: 999
        min: 1
      field: tags
    description: |-
      At least one tag should be defined for each operation.

      **Valid Example**

      ```json lineNumbers
      {
        "get": {
           ... ,
           ... ,
           "tags": [
              "Users"
           ],
        }
      }
    message: Operation should have non-empty "tags" array.
  path-declarations-must-exist:
    given:
    - $.paths
    severity: error
    then:
      function: pattern
      functionOptions:
        notMatch: '{}'
      field: '@key'
    description: |-
      Path parameter declarations must not be empty.

      **Invalid Example**

      `/users/{}`

      **Valid Example**

      `/users/{userId}`
    message: Path parameter declarations must not be empty, ex."/given/{}" is invalid.
  contact-name:
    given:
    - $.info.contact
    severity: warn
    then:
      function: truthy
      field: name
    description: "The `contact` object should have an organization name. \n\n**Valid Example**\n\n```json lineNumbers\n{\n  \"contact\": {\n    \"name\": \"ACME Corporation\",\n     ... ,\n     ... \n},\n```\n"
    message: Contact object should have "name"
  path-keys-no-trailing-slash:
    given:
    - $.paths
    severity: warn
    then:
      function: pattern
      functionOptions:
        notMatch: .+\/$
      field: '@key'
    description: |-
      Path keys should not end in forward slashes. This is a best practice for working with web tooling, such as mock servers, code generators, application frameworks, and more).

      **Invalid Example**

      ```json
      {
       "/users/": {
      ```

      **Valid Example**

      ```json
      {
       "/users": {
      ```
    message: Path should not end with slash.
  path-not-include-query:
    given:
    - $.paths
    severity: warn
    then:
      function: pattern
      functionOptions:
        notMatch: \?
      field: '@key'
    description: |-
      Paths should not include `query` string items. Instead, add them as parameters with `in: query`.

      **Invalid Example**

      ```json
      {
       "/users/{?id}": {

      ```

      **Valid Example**

      ```json lineNumbers
      {
        "parameters": [
          {
            "schema": {
              "type": "string"
            },
            "name": "id",
            "in": "path",
            "required": true,
            "description": "User's ID"
          }
        ]
      }

      ```
    message: Path should not include query string.
  tag-description:
    given:
    - $.tags[*]
    severity: warn
    then:
      function: truthy
      field: description
    description: |-
      Tags defined at the global level should have a description.

      **Valid Example**

      ```json lineNumbers
      {
         "tags": [
            {
               "name":"Users",
               "description":"End-user information"
            }
         ]
      }
      ```
    message: Tag object should have "description".
  api-servers-oas2:
    given:
    - $.host
    severity: warn
    then:
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 1
          items:
            type: object
        dialect: draft7
    description: "A server should be defined at the root document level. This can be localhost, a development server, or a production server. \n\n**Valid OpenAPI V3 Example**\n\n```json\n{\n  \"servers\": [\n    {\n      \"url\": \"https://staging.myprodserver.com/v1\",\n      \"description\": \"Staging server\"\n    },\n    {\n      \"url\": \"https://myprodserver.com/v1\",\n      \"description\": \"Production server\"\n    }\n  ]\n}\n```\n\n**Valid OpenAPI V2 Example**\n\n```json\n{\n  \"host\": \"myprodserver.com\",\n  \"basePath\": \"/v2\",\n  \"schemes\": [\n    \"https\"\n  ]\n}\n```\n\n"
    message: Server should be present.
    formats:
    - oas2
  api-servers-oas3:
    given:
    - $.servers
    severity: warn
    then:
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 1
          items:
            type: object
        dialect: draft7
    description: "A server should be defined at the root document level. This can be localhost, a development server, or a production server. \n\n**Valid OpenAPI V3 Example**\n\n```json\n{\n  \"servers\": [\n    {\n      \"url\": \"https://staging.myprodserver.com/v1\",\n      \"description\": \"Staging server\"\n    },\n    {\n      \"url\": \"https://myprodserver.com/v1\",\n      \"description\": \"Production server\"\n    }\n  ]\n}\n```\n\n**Valid OpenAPI V2 Example**\n\n```json\n{\n  \"host\": \"myprodserver.com\",\n  \"basePath\": \"/v2\",\n  \"schemes\": [\n    \"https\"\n  ]\n}\n```\n\n"
    message: Server should be present.
    formats:
    - oas3
  server-trailing-slash-oas2:
    given:
    - $.host
    severity: warn
    then:
      function: pattern
      functionOptions:
        notMatch: /$
    description: "Server URLs should not end in forward slashes. This is a best practice for working with web tooling, such as mock servers, code generators, application frameworks, and more).\n\n**Invalid Example**\n\n```json lineNumbers\n{  \n  \"servers\": [\n    {\n      ... ,\n      \"url\": \"https://api.openweathermap.org/data/2.5/\"\n    }\n  ]\n}\n```\n\n**Valid Example**\n\n```json lineNumbers\n{  \n  \"servers\": [\n    {\n      ... ,\n      \"url\": \"https://api.openweathermap.org/data/2.5\"\n    }\n  ]\n}\n```"
    message: Server URL should not have trailing slash
    formats:
    - oas2
  server-trailing-slash-oas3:
    given:
    - $.servers[*].url
    severity: warn
    then:
      function: pattern
      functionOptions:
        notMatch: /$
    description: "Server URLs should not end in forward slashes. This is a best practice for working with web tooling, such as mock servers, code generators, application frameworks, and more).\n\n**Invalid Example**\n\n```json lineNumbers\n{  \n  \"servers\": [\n    {\n      ... ,\n      \"url\": \"https://api.openweathermap.org/data/2.5/\"\n    }\n  ]\n}\n```\n\n**Valid Example**\n\n```json lineNumbers\n{  \n  \"servers\": [\n    {\n      ... ,\n      \"url\": \"https://api.openweathermap.org/data/2.5\"\n    }\n  ]\n}\n```"
    message: Server URL should not have trailing slash
    formats:
    - oas3
  operation-success-response:
    given:
    - $.paths[*][get,put,post,delete,options,head,patch,trace]
    severity: warn
    then:
      function: oasOpSuccessResponse
      field: responses
    description: |-
      Operations should have at least one "2xx" or "3xx" response defined.

      **Invalid Example**

      ```json lineNumbers
      {
        "get": {
            ... ,
            "responses": {},
        }
      }
      ```

      **Valid Example**

      ```json lineNumbers
      {
        "get": {
            ... ,
            "responses": {
              "200": {
                "description": "OK"
              }
            },
        }
      }
      ```
    message: Operation should have at least one "2xx" or "3xx" response.
  path-params:
    given:
    - $
    severity: error
    then:
      function: oasPathParam
    description: |-
      Path parameters must be defined and valid in either the `path-parameters` or the `operation-parameters` object. Likewise, defined `path-parameters` or `operation-parameters` must be used in the `paths` string.

      **Valid Example**

      For this path:

      `/users/{id}/{location}`

      The following path parameters must be defined.

      ```json lineNumbers
            "parameters": [
              {
                "schema": {
                  "type": "string"
                },
                "name": "id",
                "in": "path",
                "required": true,
                "description": "This is the user's ID"
              },
              {
                "schema": {
                  "type": "string"
                },
                "name": "location",
                "in": "path",
                "required": true,
                "description": "This is the user's location"
              }
            ]
          }
        },
        ```
    message: '{{error}}'
  operation-parameters:
    given:
    - $.paths[*][get,put,post,delete,options,head,patch,trace]
    severity: warn
    then:
      function: oasOpParams
      field: parameters
    description: |-
      Operation parameters should be unique and non-repeating:

      * `name` and `in` must be unique

      For OAS2:

      * Operations should not have `in: body` and `in: formData` parameters.
      * Operations should have only one `in: body` parameter.

      **Invalid Example**

      In this example, the query paramater `"name": "last name"` is repeated.

      ```json lineNumbers
      {
        "parameters": [
          {
            "schema": {
              "type": "string"
            },
            "in": "query",
            "name": "last name",
            "description": "User's last name"
          },
          {
            "schema": {
              "type": "string"
            },
            "in": "query",
            "name": "last name",
            "description": "User's last name"
          }
        ],
      }
      ```

      **Valid Example**

      In this example, query parameters are unique.

      ```json lineNumbers
      {
        "parameters": [
          {
            "schema": {
              "type": "string"
            },
            "in": "query",
            "name": "first name",
            "description": "User's first name"
          },
          {
            "schema": {
              "type": "string"
            },
            "in": "query",
            "name": "last name",
            "description": "User's last name"
          }
        ],
      }
      ```
    message: Operation parameters are unique and non-repeating.
  typed-enum:
    given:
    - $..[?(@ && @.enum && @.type)]
    severity: warn
    then:
      function: typedEnum
    description: |-
      All `enum' values should respect the specified type.

      **Invalid Example**

      In this example, the `enum` type is `integer`, but the values are strings.

      ```json lineNumbers
      {
          "schema": {
            "type": "integer",
            "enum": [
               "standard",
               "metric",
               "imperial"
             ]
           },
      ```

      **Valid Example**

      In this example, the `enum` type is `string` and the values are strings.

      ```json lineNumbers
      {
          "schema": {
            "type": "string",
            "enum": [
               "standard",
               "metric",
               "imperial"
             ]
           },
    message: '{{error}}'
  oas2-schema:
    given:
    - $
    severity: error
    then:
      function: oasDocumentSchema
    description: This Stoplight core rule validates the structure of OpenAPI v2 specification. This rule should never be disabled.
    message: '{{error}}'
    formats:
    - oas2
  oas3-schema:
    given:
    - $
    severity: error
    then:
      function: oasDocumentSchema
    description: This Stoplight core rule validates the structure of OpenAPI v3.x specification. This rule should never be disabled.
    message: '{{error}}'
    formats:
    - oas3
  oas3-unused-component:
    given:
    - $
    severity: warn
    then:
      function: oasUnusedComponent
    description: A potentially shareable component is not being used. This may be expected, but you should review sharable components to avoid duplicate entry.
    message: '{{error}}'
    formats:
    - oas3
  operation-operationId-unique:
    given:
    - $
    severity: error
    then:
      function: oasOpIdUnique
    description: |
      Every operation in a single document must have a unique `operationID`.

      **Valid Example**

      In this example, the `operationId` is `get-users`. This `operationId` must be unique in an API document.

      ```json lineNumbers
      {
        "get": {
              "summary": "Get users",
              ... ,
              "operationId": "get-users"
            }
      }
      ```
    message: Every operation must have unique operationId
  oas2-operation-formData-consume-check:
    given:
    - $.paths[*][get,put,post,delete,options,head,patch,trace]
    severity: error
    then:
      function: oasOpFormDataConsumeCheck
    description: |-
      Operations with an `in: formData` parameter must include a `consumes` property with one of these values:

      `application/x-www-form-urlencoded`

      `multipart/form-data`

      **Valid Example**

      In this example, the `consumes` property correctly includes the `multipart/form-data` value.

      ```json lineNumbers
      {
         "post":{
            "summary":"Uploads a file",
            "consumes":[
               "multipart/form-data"
            ],
            "parameters":[
               {
                  "name":"name",
                  "in":"formData",
                  "description":"Upload a file",
                  "required":false,
                  "type":"string"
               }
            ]
         }
      }
    message: 'Operations with "in: formData" parameter must include "application/x-www-form-urlencoded" or "multipart/form-data" in their "consumes" property.'
    formats:
    - oas2
  operation-tag-defined:
    given:
    - $
    severity: warn
    then:
      function: oasTagDefined
    description: "Tags defined at the operation level should also be defined at the global level. \n\n**Operation-level Example**\n\n```json lineNumbers\n{\n  \"get\": {\n     ... ,\n     ... ,\n     \"tags\": [\n        \"Users\"\n     ],\n  }\n}  \n```\n\n**Global-level Example**\n\n```json lineNumbers\n{\n  \"tags\": [\n     {\n       \"name\": \"Users\",\n       ... ,\n     }\n  ],\n}\n\n```"
    message: Operation tags must be defined in global tags
  no-$ref-siblings:
    given:
    - $..[?(@property === '$ref')]
    severity: error
    then:
      function: refSiblings
    description: Property must not be placed among $ref.
    message: '{{error}}'
    formats:
    - oas3.0
    - oas2
  oas2-operation-security-defined:
    given:
    - $
    severity: warn
    then:
      function: oasOpSecurityDefined
      functionOptions:
        schemesPath:
        - securityDefinitions
    description: |-
      Operation `security` values must match a scheme defined in the global `securityDefinitions` object. Empty `security` values for operations are ignored if authentication is not explicity required or is optional.

      **Valid Example**

      For this global security scheme:

      ```json lineNumbers
      {
        "securityDefinitions": {
          "API Key": {
            "name": "API Key",
            "type": "apiKey",
            "in": "query"
          }
        }
      }
      ```

      This is a valid operation security value:

      ```json lineNumbers
      {  "operationId": "get-users-userId",
              "security": [
                {
                  "API Key": []
                }
              ]
      }
      ```

      **Invalid Example**

      For the same global security scheme, this is an invalid operation security value:

      ```json lineNumbers
      {  "operationId": "get-users-userId",
              "security": [
                {
                  "oath2": []
                }
              ]
      }
      ```
    message: '{{error}}'
    formats:
    - oas2
  oas3-operation-security-defined:
    given:
    - $
    severity: warn
    then:
      function: oasOpSecurityDefined
      functionOptions:
        schemesPath:
        - components
        - securitySchemes
    description: "Operation `security` values must match a scheme defined in the global `components.security.Schemes` object. \n\n**Valid Example**\n\nFor this global security scheme:\n\n```json lineNumbers\n{\n\"components\": {\n  \"security\": [\n    {\n      \"app-id\": []\n    }\n  ]\n }\n}\n```\n\n`app-id` is a valid operation `security` value:\n\n```json lineNumbers\n{  \n    \"get\": {\n        \"security\": [\n          {\n            \"app-id\": []\n          }\n      ]\n  }\n}  \n```\n\n**Invalid Example**\n\nFor the same global security scheme, `oath2` is an invalid operation `security` value:\n\n```json lineNumbers\n{  \n    \"get\": {\n        \"security\": [\n          {\n            \"oath2\": []\n          }\n      ]\n  }\n}  \n```"
    message: '{{error}}'
    formats:
    - oas3
  duplicated-entry-in-enum:
    given:
    - $..[?(@ && @.enum)]
    severity: warn
    then:
      function: oasSchema
      functionOptions:
        schema:
          type: array
