$schema: https://json-schema.org/draft/2020-12/schema
$id: https://example.com/schemas/address.v1.yaml
title: AddressLibrary
type: object

$defs:
  PostalAddress:
    type: object
    required: [street, city, country]
    properties:
      street:
        type: string
      city:
        type: string
      zipCode:
        # pattern + examples array (draft 2020-12 keyword)
        type: string
        pattern: '^[0-9]{5}$'
        examples:
          - '10001'
          - '90210'
      country:
        $ref: '#/$defs/CountryCode'

  CountryCode:
    type: string
    minLength: 2
    maxLength: 2
    pattern: '^[A-Z]{2}$'

  # tuple validation - prefixItems only in 2020-12
  GeoCoordinates:
    type: array
    prefixItems:
      - type: number
        minimum: -90
        maximum: 90
      - type: number
        minimum: -180
        maximum: 180
    items: false
    minItems: 2
    maxItems: 2

  # contains - array must contain at least one matching item
  NonEmptyTags:
    type: array
    contains:
      type: string
      minLength: 1
    minContains: 1
